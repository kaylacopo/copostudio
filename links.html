<title>Kayla Piscopo Links</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#0A0A0A; --void-2:#131313; --void-3:#1B1B1B;
  --snow:#F1EEE7; --snow-2:#A29F99; --snow-3:#6B6862;
  --pop:#F74F4F; --rule:rgba(241,238,231,.14);
  --grad:linear-gradient(135deg,#1A0533 0%,#6B1480 12%,#D6177B 32%,#F03B3B 52%,#F77428 68%,#F9B47A 84%,#C6A8E8 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--snow);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:48px 22px;
}
.card{width:100%; max-width:600px}

.eyebrow{
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:13px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--snow-2);
  display:flex; align-items:center; gap:11px; margin:0 0 28px;
}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pop);flex:none}

h1{
  font-family:Inter,sans-serif; font-weight:500;
  font-size:clamp(46px,12vw,62px); line-height:.96; letter-spacing:-.035em;
  margin:0 0 10px;
}
h1 .stop{color:var(--pop)}
.role{font-size:19px; line-height:1.5; color:var(--snow-2); margin:0; max-width:34ch}

.rule{height:4px; border-radius:2px; background:var(--grad); margin:30px 0 34px}

.links{display:flex; flex-direction:column; gap:12px; list-style:none; margin:0; padding:0}
.link{
  display:flex; align-items:center; gap:18px;
  min-height:76px; padding:20px 22px;
  border:1px solid var(--rule); border-radius:6px;
  background:var(--void-2); color:var(--snow); text-decoration:none;
  transition:background .18s ease, border-color .18s ease, transform .18s ease;
}
.link:hover,.link:focus-visible{background:var(--void-3); border-color:var(--snow-3); transform:translateY(-1px)}
.link:focus-visible{outline:2px solid var(--pop); outline-offset:3px}
.idx{
  font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.1em;
  color:var(--snow-3); flex:none; width:26px;
}
.body{flex:1 1 auto; min-width:0}
.label{display:block; font-size:21px; font-weight:500; letter-spacing:-.015em; line-height:1.25}
.meta{
  display:block; font-family:"JetBrains Mono",monospace; font-size:13px;
  letter-spacing:.06em; color:var(--snow-3); margin-top:6px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.arrow{flex:none; color:var(--snow-3); font-size:22px; line-height:1}
.link:hover .arrow{color:var(--pop)}

footer{
  margin-top:38px; padding-top:22px; border-top:1px solid var(--rule);
  font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--snow-3);
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
}

/* phones — this page is reached by scanning a code, so it is read on a phone first */
@media (max-width:760px){
  body{padding:40px 20px 34px; align-items:flex-start}
  .card{max-width:none}
  .eyebrow{font-size:14px; margin-bottom:30px}
  .eyebrow::before{width:9px;height:9px}
  h1{font-size:clamp(52px,15vw,76px); margin-bottom:12px}
  .role{font-size:20px}
  .rule{height:5px; margin:32px 0 30px}
  .links{gap:13px}
  .link{min-height:92px; padding:22px 22px; gap:16px; border-radius:8px}
  .idx{font-size:14px; width:28px}
  .label{font-size:23px; line-height:1.22}
  .meta{font-size:14px; margin-top:7px}
  .arrow{font-size:25px}
  footer{margin-top:34px; font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="rule"></div>

    <li><a class="link" href="https://copostudio.com" target="_blank" rel="noopener">
      <span class="idx">02</span>
      <span class="body"><span class="label">Copo Studio</span><span class="meta">copostudio.com</span></span>
      <span class="arrow" aria-hidden="true">→</span>

      <span class="arrow" aria-hidden="true">→</span>

  </ul>

  <footer>
    <span>Stop thinking like a founder</span>

  </footer>
</div>
